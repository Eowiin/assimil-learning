[project]
name = "assimil-server"
version = "0.1.0"
description = "Le serveur de la maison : les modèles que l'iPhone ne peut pas faire tourner."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
